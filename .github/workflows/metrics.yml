name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Base sections to display
          base: header, cover, activity
          # Template style
          template: classic
          # Timezone
          config_timezone: Europe/London
          # Output settings
          output_action: commit
          config_padding: "0 8 + 11%"
          # Plugins
          plugin_achievements: yes
          plugin_activity: yes
          plugin_calendar: yes
          plugin_languages: yes
          plugin_stars: yes
          plugin_topics: yes